name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The account tests run against a real Postgres here, and an embedded one locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scrap-riot-server .
      - name: Start with the same restrictions as docker-compose.yml, then check health
        run: |
          docker run -d --name game -p 8787:8787 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -e ALLOWED_ORIGINS=https://example.com scrap-riot-server
          for i in $(seq 1 20); do
            curl -sf http://localhost:8787/health && exit 0
            sleep 1
          done
          docker logs game
          exit 1
